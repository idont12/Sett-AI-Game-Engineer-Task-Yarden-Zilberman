<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fishing In The Deep</title>
<style>
    body,html{margin:0;padding:0;background:#0a1a2a;font-family:sans-serif;color:#fff;overflow:hidden;}
    canvas{display:block;margin:0 auto;background:linear-gradient(#6ec6ff,#003b5c);}
    #ui{position:absolute;top:0;left:0;width:100%;pointer-events:none;}
    .topBar{display:flex;justify-content:space-between;padding:10px;font-size:18px;}
    .centerMsg{position:absolute;top:40%;width:100%;text-align:center;font-size:20px;}
    .bottom{position:absolute;bottom:20px;width:100%;text-align:center;}
    button{pointer-events:auto;padding:10px 20px;border:none;border-radius:10px;background:#ffd54f;font-size:18px;}
    .upgrade{margin:5px;}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
    <div class="topBar">
        <div id="coins">🪙 100</div>
        <div id="fish" style="display:none;">🐟 0</div>
    </div>
    <div class="centerMsg" id="msg"></div>
    <div class="bottom">
        <div id="upgrades">
            <button class="upgrade" onclick="upgradeFish()">Max Fish</button>
            <button class="upgrade" onclick="upgradeDepth()">Max Depth</button>
        </div>
        <button id="playBtn" onclick="pressPlay()">Play</button>
    </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let w,h;

function resize(){
    w=canvas.width=window.innerWidth;
    h=canvas.height=window.innerHeight;
}
window.onresize=resize; resize();

/////////////////////////
// STATE
/////////////////////////
let state="menu";
let coins=100;
let fishCount=0;
let round=1;

let maxFish=6;
let maxDepth=5;

let fishUpgrades=[{v:7,c:50},{v:8,c:100},{v:9,c:200},{v:10,c:400}];
let depthUpgrades=[{v:10,c:50},{v:15,c:75},{v:20,c:150},{v:30,c:300}];

/////////////////////////
// GAUGE
/////////////////////////
let gaugeT=0;
let gaugeDir=1;
let gaugeActive=true;
let selectedDepth=0;

/////////////////////////
// HOOK
/////////////////////////
let hook={x:0,y:0,targetY:0,phase:"idle",speed:2};

/////////////////////////
// FISH
/////////////////////////
let fishes=[];
function spawnFish(){
    fishes=[];
    for(let i=0;i<20;i++){
        fishes.push({
            x:Math.random()*w,
            y:Math.random()*h*2,
            caught:false,
            value:10+Math.floor(Math.random()*20)
        });
    }
}

/////////////////////////
// UI
/////////////////////////
function updateUI(){
    document.getElementById("coins").innerText="🪙 "+coins;
    document.getElementById("fish").innerText="🐟 "+fishCount;
}

/////////////////////////
// UPGRADES
/////////////////////////
function upgradeFish(){
    if(fishUpgrades.length===0) return;
    let u=fishUpgrades[0];
    if(coins>=u.c){
        coins-=u.c;
        maxFish=u.v;
        fishUpgrades.shift();
        updateUI();
    }
}
function upgradeDepth(){
    if(depthUpgrades.length===0) return;
    let u=depthUpgrades[0];
    if(coins>=u.c){
        coins-=u.c;
        maxDepth=u.v;
        depthUpgrades.shift();
        updateUI();
    }
}

/////////////////////////
// PLAY
/////////////////////////
function pressPlay(){
    if(state!=="menu") return;

    state="gauge";
    document.getElementById("upgrades").style.display="none";
}

/////////////////////////
// INPUT
/////////////////////////
canvas.addEventListener("pointerdown",()=>{
    if(state==="gauge"){
        gaugeActive=false;
        let min=maxDepth-2;
        selectedDepth=min + (maxDepth-min)*gaugeT;

        startFishing();
    }
});

/////////////////////////
// START FISHING
/////////////////////////
function startFishing(){
    state="down";
    fishCount=0;

    document.getElementById("coins").style.display="none";
    document.getElementById("fish").style.display="block";

    hook.y=0;
    hook.targetY=selectedDepth*50;
    hook.phase="down";

    spawnFish();
}

/////////////////////////
// LOOP
/////////////////////////
function update(){
    if(state==="gauge"){
        if(gaugeActive){
            gaugeT+=0.01*gaugeDir;
            if(gaugeT>1){gaugeT=1;gaugeDir=-1;}
            if(gaugeT<0){gaugeT=0;gaugeDir=1;}
        }
    }

    if(state==="down"){
        hook.y+=3;
        if(hook.y>=hook.targetY){
            state="pause";
            setTimeout(()=>{
                if(round===1){
                    document.getElementById("msg").innerText="move the hook to catch fish";
                    setTimeout(()=>document.getElementById("msg").innerText="",2000);
                }
                state="up";
            },600);
        }
    }

    if(state==="up"){
        hook.y-=2;

        fishes.forEach(f=>{
            if(!f.caught && Math.abs(f.x-hook.x)<30 && Math.abs(f.y-hook.y)<30){
                if(fishCount<maxFish){
                    f.caught=true;
                    fishCount++;
                }
            }
        });

        if(fishCount>=maxFish){
            hook.y-=5;
        }

        if(hook.y<=0){
            endRound();
        }
    }
}

/////////////////////////
// END ROUND
/////////////////////////
function endRound(){
    state="result";

    document.getElementById("coins").style.display="block";
    document.getElementById("fish").style.display="none";

    let gain=fishCount*20;
    coins+=gain;

    updateUI();

    setTimeout(()=>{
        round++;
        if(round>3){
            document.getElementById("msg").innerText="Game Over!";
            state="done";
        }else{
            resetRound();
        }
    },1000);
}

function resetRound(){
    state="menu";
    gaugeActive=true;
    document.getElementById("upgrades").style.display="block";
}

/////////////////////////
// DRAW
/////////////////////////
function draw(){
    ctx.clearRect(0,0,w,h);

    // hook
    ctx.fillStyle="white";
    ctx.fillRect(hook.x,hook.y,5,20);

    // fishes
    ctx.fillStyle="orange";
    fishes.forEach(f=>{
        if(!f.caught){
            ctx.beginPath();
            ctx.arc(f.x,f.y,10,0,Math.PI*2);
            ctx.fill();
        }
    });

    // gauge
    if(state==="gauge"){
        let gx=w/2-100;
        let gy=h-100;

        ctx.fillStyle="#fff";
        ctx.fillRect(gx,gy,200,10);

        let px=gx+200*gaugeT;
        ctx.fillRect(px,gy-5,5,20);
    }
}

/////////////////////////
// MAIN LOOP
/////////////////////////
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();

updateUI();
</script>
</body>
</html>
