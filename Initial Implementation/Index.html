<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fishing In The Deep</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
<style>
body { margin:0; background:#0a1a2a; }
canvas { display:block; margin:0 auto; }
</style>
</head>
<body>

<script>
class BootScene extends Phaser.Scene {
    constructor(){ super('Boot'); }
    create(){ this.scene.start('Preload'); }
}

class PreloadScene extends Phaser.Scene {
    constructor(){ super('Preload'); }
    preload(){
        this.load.audio('bg', 'assets/background_music.mp3');
    }
    create(){ this.scene.start('Game'); }
}

class GameScene extends Phaser.Scene {
    constructor(){ super('Game'); }

    init(){
        this.coins = 100;
        this.round = 1;
        this.maxRounds = 3;

        this.maxFish = 6;
        this.maxDepth = 5;

        this.isFishing = false;
    }

    create(){
        this.width = this.scale.width;
        this.height = this.scale.height;

        this.createUI();
        this.createGauge();

        this.input.on('pointerdown', this.handleTap, this);
        this.input.on('pointermove', this.handleMove, this);
    }

    createUI(){
        this.coinText = this.add.text(this.width/2, 40, "🪙 100", {fontSize:24}).setOrigin(0.5);
        this.fishText = this.add.text(this.width/2, 40, "🐟 0", {fontSize:24}).setOrigin(0.5).setVisible(false);

        this.playBtn = this.add.text(this.width/2, this.height-80, "PLAY", {fontSize:32, backgroundColor:"#fff", color:"#000"})
            .setOrigin(0.5)
            .setPadding(10)
            .setInteractive();

        this.playBtn.on('pointerdown', () => this.startGauge());

        this.upgradeFishBtn = this.add.text(this.width/2 - 100, this.height-140, "Fish+", {fontSize:20})
            .setInteractive();

        this.upgradeDepthBtn = this.add.text(this.width/2 + 100, this.height-140, "Depth+", {fontSize:20})
            .setInteractive();

        this.upgradeFishBtn.on('pointerdown', () => {
            if(this.coins >= 50){
                this.coins -= 50;
                this.maxFish++;
                this.updateCoins();
            }
        });

        this.upgradeDepthBtn.on('pointerdown', () => {
            if(this.coins >= 50){
                this.coins -= 50;
                this.maxDepth += 5;
                this.updateCoins();
            }
        });
    }

    createGauge(){
        this.gaugePointer = this.add.rectangle(this.width/2, this.height-200, 10, 40, 0xffffff);
        this.gaugeDir = 1;
        this.gaugeActive = false;
    }

    startGauge(){
        if(this.isFishing) return;
        this.gaugeActive = true;
        this.playBtn.setVisible(false);
    }

    handleTap(){
        if(this.gaugeActive){
            this.gaugeActive = false;
            let t = (this.gaugePointer.x - this.width*0.2) / (this.width*0.6);
            this.targetDepth = Phaser.Math.Linear(this.maxDepth-2, this.maxDepth, t);
            this.startFishing();
        }
    }

    handleMove(pointer){
        if(this.isFishing && this.hook){
            this.hook.x = Phaser.Math.Clamp(pointer.x, 50, this.width-50);
        }
    }

    startFishing(){
        this.isFishing = true;
        this.fishCaught = 0;

        this.coinText.setVisible(false);
        this.fishText.setVisible(true);

        this.hook = this.add.rectangle(this.width/2, 0, 10, 20, 0xff0000);

        this.fishGroup = [];

        for(let i=0;i<10;i++){
            let fish = this.add.circle(
                Phaser.Math.Between(50, this.width-50),
                Phaser.Math.Between(200, this.height),
                10,
                0x00ffcc
            );
            fish.value = Phaser.Math.Between(1,5);
            this.fishGroup.push(fish);
        }

        this.tweens.add({
            targets:this.hook,
            y:this.height * 0.7,
            duration:1000,
            onComplete:()=> this.startAscend()
        });
    }

    startAscend(){
        this.tweens.add({
            targets:this.hook,
            y:0,
            duration:2000,
            onUpdate:()=> this.checkCatch(),
            onComplete:()=> this.endRound()
        });
    }

    checkCatch(){
        this.fishGroup.forEach(fish=>{
            if(!fish.caught && Phaser.Math.Distance.Between(this.hook.x,this.hook.y,fish.x,fish.y)<20){
                fish.caught = true;
                fish.setFillStyle(0xffff00);
                this.fishCaught++;
                this.fishText.setText("🐟 " + this.fishCaught);

                if(this.fishCaught >= this.maxFish){
                    this.hook.y -= 5;
                }
            }
        });
    }

    endRound(){
        let total = 0;
        this.fishGroup.forEach(f=>{
            if(f.caught) total += f.value;
            f.destroy();
        });

        this.coins += total;
        this.updateCoins();

        this.hook.destroy();
        this.isFishing = false;

        this.fishText.setVisible(false);
        this.coinText.setVisible(true);

        if(this.round >= this.maxRounds){
            this.showEnd();
        } else {
            this.round++;
            this.playBtn.setVisible(true);
        }
    }

    showEnd(){
        this.add.text(this.width/2, this.height/2, "Game Over\nCoins: "+this.coins,
            {fontSize:32, align:"center"}).setOrigin(0.5);
    }

    update(time){
        if(this.gaugeActive){
            this.gaugePointer.x += this.gaugeDir * 5;
            if(this.gaugePointer.x > this.width*0.8 || this.gaugePointer.x < this.width*0.2){
                this.gaugeDir *= -1;
            }
        }
    }

    updateCoins(){
        this.coinText.setText("🪙 " + this.coins);
    }
}

const config = {
    type: Phaser.AUTO,
    width: 360,
    height: 640,
    backgroundColor: "#102030",
    scene: [BootScene, PreloadScene, GameScene],
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    }
};

new Phaser.Game(config);
</script>

</body>
</html>
